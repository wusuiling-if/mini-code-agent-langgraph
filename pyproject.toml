[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-code-agent-langgraph"
version = "0.1.0"
description = "A tiny LangGraph-based coding agent for learning agent loops, bash tool use, and trajectories."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph",
    "langchain-core",
    "langchain-openai",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
mca = "mini_code_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
