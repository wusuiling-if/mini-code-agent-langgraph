[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-code-agent-langgraph"
version = "0.6.0"
description = "A compact transactional runtime for verified coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "wusuiling-if" },
]
keywords = ["coding-agent", "transactions", "verification", "langgraph", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "langgraph>=1.0,<2",
    "langchain-core>=1.4,<2",
    "langchain-openai>=1.3,<2",
    "langchain-deepseek>=1.1,<2",
    "regex>=2024.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.17,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "PyYAML>=6.0.2,<7",
    "ruff>=0.12,<1",
    "twine>=6,<7",
]

[project.scripts]
mca = "mini_code_agent.cli:main"

[project.urls]
Homepage = "https://github.com/wusuiling-if/mini-code-agent-langgraph"
Repository = "https://github.com/wusuiling-if/mini-code-agent-langgraph"
Issues = "https://github.com/wusuiling-if/mini-code-agent-langgraph/issues"
Changelog = "https://github.com/wusuiling-if/mini-code-agent-langgraph/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These names remain importable from agent.py for backward compatibility.
"src/mini_code_agent/agent.py" = ["F401"]
# Evaluation entry points deliberately amend sys.path before importing the checkout.
"evals/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["memory_core", "mini_code_agent"]

[tool.coverage.report]
fail_under = 80
show_missing = true
