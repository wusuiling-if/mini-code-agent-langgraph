name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests evals benchmarks
      - name: Check formatting of the v0.6 memory boundary
        run: >-
          python -m ruff format --check
          src/mini_code_agent/conversation_ledger.py
          src/mini_code_agent/conversation_memory.py
          src/mini_code_agent/memory_backup.py
          src/mini_code_agent/cli.py
          evals/run_conversation_memory.py
          evals/run_memory_suite.py
          tests/test_conversation_memory_runtime.py
          tests/test_memory_release_suite.py
      - name: Type-check the v0.6 memory trust boundary
        run: >-
          python -m mypy
          src/mini_code_agent/conversation_ledger.py
          src/mini_code_agent/conversation_memory.py
          src/mini_code_agent/memory_backup.py
      - run: >-
          python -m pytest -q
          --cov=src/mini_code_agent
          --cov=src/memory_core
          --cov-report=term-missing
          --cov-fail-under=80

  cli-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - run: python -m pip install -e ".[dev]"
      - run: mca --version
      - run: mca --help
      - run: mca doctor --sandbox none
      - name: Exercise native Windows command and transaction paths
        if: runner.os == 'Windows'
        run: python -m pytest -q tests/test_windows_compat.py tests/test_transaction.py
      - name: Run no-key agent demo on native Windows
        if: runner.os == 'Windows'
        run: mca demo
      - name: Run no-key transaction demo on native Windows
        if: runner.os == 'Windows'
        run: mca tx demo

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - run: python -m pip install build twine
      - run: python -m build --sdist --wheel
      - run: python -m twine check dist/*
      - name: Verify source distribution assets
        run: >-
          python -c "from pathlib import Path; import tarfile;
          archives = list(Path('dist').glob('*.tar.gz'));
          assert len(archives) == 1, archives;
          names = tarfile.open(archives[0]).getnames();
          assert any(name.endswith('/evals/run_evals.py') for name in names), names;
          assert any(name.endswith('/evals/run_memory_suite.py') for name in names), names;
          assert any('/evals/fixtures/' in name for name in names), names;
          assert any(name.endswith('/benchmarks/harbor/mca_agent.py') for name in names), names;
          assert any(name.endswith('/benchmarks/harbor/protocol.json') for name in names), names"
      - run: python -m venv .package-venv
      - name: Install the wheel in the clean environment
        run: >-
          python -c "from pathlib import Path; import subprocess;
          wheels = list(Path('dist').glob('*.whl'));
          assert len(wheels) == 1, wheels;
          subprocess.check_call(['.package-venv/bin/python', '-m', 'pip', 'install', str(wheels[0])])"
      - run: .package-venv/bin/mca --version
      - run: .package-venv/bin/mca --help
      - run: .package-venv/bin/mca doctor --sandbox none
      - run: .package-venv/bin/python -c "import memory_core; import mini_code_agent"
      - run: .package-venv/bin/python -m pip check
      - run: .package-venv/bin/mca demo

  offline-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - run: python -m pip install -e .
      - run: python -m evals.run_evals --json --output artifacts/evals/v0.3.2.json
      - run: python -m evals.run_memory_suite --json --output /tmp/memory-v0.6.0.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: offline-eval-v0.3.2
          path: artifacts/evals/v0.3.2.json
          if-no-files-found: error
          retention-days: 7
