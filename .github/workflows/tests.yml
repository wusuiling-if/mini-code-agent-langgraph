name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  cli-smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - run: python -m pip install -e .
      - run: mca --version
      - run: mca --help
      - run: mca doctor --sandbox none

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - run: python -m pip install build twine
      - run: python -m build --sdist --wheel
      - run: python -m twine check dist/*
      - name: Verify source distribution assets
        run: >-
          python -c "from pathlib import Path; import tarfile;
          archives = list(Path('dist').glob('*.tar.gz'));
          assert len(archives) == 1, archives;
          names = tarfile.open(archives[0]).getnames();
          assert any(name.endswith('/evals/run_evals.py') for name in names), names;
          assert any('/evals/fixtures/' in name for name in names), names"
      - run: python -m venv .package-venv
      - name: Install the wheel in the clean environment
        run: >-
          python -c "from pathlib import Path; import subprocess;
          wheels = list(Path('dist').glob('*.whl'));
          assert len(wheels) == 1, wheels;
          subprocess.check_call(['.package-venv/bin/python', '-m', 'pip', 'install', str(wheels[0])])"
      - run: .package-venv/bin/mca --version
      - run: .package-venv/bin/mca --help
      - run: .package-venv/bin/mca doctor --sandbox none
      - run: .package-venv/bin/python -m pip check
      - run: .package-venv/bin/mca demo

  offline-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - run: python -m pip install -e .
      - run: python -m evals.run_evals --json --output artifacts/evals/v0.3.2.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verified-patch-eval
          path: artifacts/evals/v0.3.2.json
          if-no-files-found: error
          retention-days: 7
