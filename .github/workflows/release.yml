name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import sys
          import tomllib
          from pathlib import Path

          root = Path.cwd().resolve()
          sys.path.insert(0, str(root / "src"))
          from mini_code_agent import __version__ as source_version

          version = tomllib.loads((root / "pyproject.toml").read_text())["project"]["version"]
          if source_version != version:
              raise SystemExit(
                  f"source version {source_version!r} does not match pyproject version {version!r}"
              )
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"release tag {tag!r} does not match package version {version!r}; expected {expected!r}")
          PY
      - name: Verify release commit is reachable from main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag must point to a commit reachable from origin/main." >&2
            exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build --sdist --wheel
      - run: python -m twine check dist/*
      - name: Verify source distribution assets
        run: >-
          python -c "from pathlib import Path; import tarfile;
          archives = list(Path('dist').glob('*.tar.gz'));
          assert len(archives) == 1, archives;
          names = tarfile.open(archives[0]).getnames();
          assert any(name.endswith('/evals/run_evals.py') for name in names), names;
          assert any('/evals/fixtures/' in name for name in names), names"
      - run: python -m venv .package-venv
      - name: Install the wheel in the clean environment
        run: >-
          python -c "from pathlib import Path; import subprocess;
          wheels = list(Path('dist').glob('*.whl'));
          assert len(wheels) == 1, wheels;
          subprocess.check_call(['.package-venv/bin/python', '-m', 'pip', 'install', str(wheels[0])])"
      - run: .package-venv/bin/mca --version
      - run: .package-venv/bin/mca --help
      - run: .package-venv/bin/mca doctor --sandbox none
      - run: .package-venv/bin/python -m pip check
      - run: .package-venv/bin/mca demo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/mini-code-agent-langgraph
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: dist/
