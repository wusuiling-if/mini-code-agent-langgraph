name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import sys
          import tomllib
          from pathlib import Path

          root = Path.cwd().resolve()
          sys.path.insert(0, str(root / "src"))
          from mini_code_agent import __version__ as source_version

          version = tomllib.loads((root / "pyproject.toml").read_text())["project"]["version"]
          if source_version != version:
              raise SystemExit(
                  f"source version {source_version!r} does not match pyproject version {version!r}"
              )
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"release tag {tag!r} does not match package version {version!r}; expected {expected!r}")
          PY
      - name: Verify release commit is reachable from main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag must point to a commit reachable from origin/main." >&2
            exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m pip install -e .
      - run: python -m evals.run_memory_suite --json --output artifacts/evals/memory-v0.5.0.json
      - run: python -m build --sdist --wheel
      - run: python -m twine check dist/*
      - name: Verify source distribution assets
        run: >-
          python -c "from pathlib import Path; import tarfile;
          archives = list(Path('dist').glob('*.tar.gz'));
          assert len(archives) == 1, archives;
          names = tarfile.open(archives[0]).getnames();
          assert any(name.endswith('/evals/run_evals.py') for name in names), names;
          assert any(name.endswith('/evals/run_memory_suite.py') for name in names), names;
          assert any('/evals/fixtures/' in name for name in names), names;
          assert any(name.endswith('/benchmarks/harbor/mca_agent.py') for name in names), names;
          assert any(name.endswith('/benchmarks/harbor/protocol.json') for name in names), names"
      - run: python -m venv .package-venv
      - name: Install the wheel in the clean environment
        run: >-
          python -c "from pathlib import Path; import subprocess;
          wheels = list(Path('dist').glob('*.whl'));
          assert len(wheels) == 1, wheels;
          subprocess.check_call(['.package-venv/bin/python', '-m', 'pip', 'install', str(wheels[0])])"
      - run: .package-venv/bin/mca --version
      - run: .package-venv/bin/mca --help
      - run: .package-venv/bin/mca doctor --sandbox none
      - run: .package-venv/bin/python -c "import memory_core; import mini_code_agent"
      - run: .package-venv/bin/python -m pip check
      - run: .package-venv/bin/mca demo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/mini-code-agent-langgraph
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
